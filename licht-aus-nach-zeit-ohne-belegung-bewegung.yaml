blueprint:
  name: Licht nach Zeit ohne Belegung oder Bewegung ausschalten
  description: Schaltet Licht in einem Bereich aus, wenn dort für eine einstellbare Zeit weder Belegung noch Bewegung erkannt wurde. Optional werden Melder in Nachbarbereichen (z. B. Flur) geprüft – meldet einer davon gerade Bewegung oder Belegung, bleibt das Licht an, bis er frei ist. Prüft zusätzlich nach Home-Assistant-Neustart und wenn ein Licht nach einem Geräte-Neustart (unavailable → on) wieder angeht.
  domain: automation
  source_url: https://github.com/rhammeran/licht-aus-nach-zeit-ohne-belegung-bewegung/blob/main/licht-aus-nach-zeit-ohne-belegung-bewegung.yaml
  input:
    target_area:
      name: Raum / Bereich
      description: Bereich, in dem Licht, Belegung und Bewegung geprüft werden sollen.
      selector:
        area: {}

    timeout:
      name: Wartezeit
      description: Zeit, nach der bei fehlender Belegung und Bewegung das Licht ausgeschaltet wird.
      default:
        hours: 0
        minutes: 5
        seconds: 0
      selector:
        duration: {}

    no_motion:
      name: Kein Bewegungsmelder verwenden
      description: Aktivieren, um den Bewegungsmelder im Bereich bei dieser Prüfung zu ignorieren – z. B. wenn er zwar vorhanden, aber unzuverlässig oder defekt ist. Fehlt im Bereich ganz ein Bewegungsmelder, erkennt die Blueprint das automatisch; dieser Schalter ist dann nicht nötig.
      default: false
      selector:
        boolean: {}

    no_occupancy:
      name: Keinen Belegungssensor verwenden
      description: Aktivieren, um den Belegungssensor im Bereich bei dieser Prüfung zu ignorieren – z. B. wenn er zwar vorhanden, aber unzuverlässig oder defekt ist. Fehlt im Bereich ganz ein Belegungssensor, erkennt die Blueprint das automatisch; dieser Schalter ist dann nicht nötig.
      default: false
      selector:
        boolean: {}

    neighbor_sensors:
      name: Melder in Nachbarbereichen (optional)
      description: Bewegungs- oder Belegungsmelder z. B. im Flur. Meldet einer davon gerade Bewegung oder Belegung, wird das Licht nicht ausgeschaltet (es könnte gerade jemand auf dem Weg in den Raum sein). Sobald er frei meldet, wird sofort nach den normalen Bedingungen geprüft – ohne erneute Wartezeit. Leer lassen, um nur den Bereich selbst zu prüfen.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
              device_class:
                - motion
                - occupancy

variables:
  target_area: !input target_area
  no_motion_override: !input no_motion
  no_occupancy_override: !input no_occupancy
  no_motion: "{{ no_motion_override or (area_entities(target_area) | select('is_state_attr', 'device_class', 'motion') | list | count == 0) }}"
  no_occupancy: "{{ no_occupancy_override or (area_entities(target_area) | select('is_state_attr', 'device_class', 'occupancy') | list | count == 0) }}"

# Fuer den Template-Trigger unten: Blueprint-variables stehen in Triggern nicht zur Verfuegung.
trigger_variables:
  target_area: !input target_area

triggers:
  - trigger: light.turned_on
    target:
      area_id: !input target_area
    options:
      behavior: each
      for: !input timeout

  # Licht kommt nach einem Geraete-Neustart (z. B. Stromausfall, Shelly mit
  # initial_state match_input) per unavailable -> on zurueck: light.turned_on
  # ueberspringt solche Wechsel, und ohne neues Melder-Ereignis liefe sonst nie
  # ein Trigger. Der Template-Trigger wird wahr, sobald ein Licht im Bereich an ist.
  - trigger: template
    id: Wiederkehr
    value_template: "{{ area_entities(target_area) | select('match', '^light[.]') | select('is_state', 'on') | list | count > 0 }}"
    for: !input timeout

  - trigger: occupancy.cleared
    target:
      area_id: !input target_area
    options:
      behavior: each
      for: !input timeout

  - trigger: motion.cleared
    target:
      area_id: !input target_area
    options:
      behavior: each
      for: !input timeout

  # Nachbarmelder frei: sofort neu pruefen. Der Bereich selbst steht nur mit
  # im Target, weil ein Trigger-Target nicht leer sein darf; dessen Meldungen
  # ohne Wartezeit scheitern an den for-Bedingungen unten.
  - trigger: motion.cleared
    id: Nachbar
    target:
      area_id: !input target_area
      entity_id: !input neighbor_sensors
    options:
      behavior: each

  - trigger: occupancy.cleared
    id: Nachbar
    target:
      area_id: !input target_area
      entity_id: !input neighbor_sensors
    options:
      behavior: each

  - trigger: homeassistant
    event: start
    id: Neustart

conditions: []

actions:
  - if:
      - condition: trigger
        id:
          - Neustart
    then:
      - delay: !input timeout

  - if:
      - condition: light.is_on
        target:
          area_id: !input target_area
        options:
          behavior: any

      # Nachbarmelder-Pruefung nur, wenn das Licht schon mindestens 2 Min an ist:
      # Sonst schaltet ein frei meldender Flur ein gerade erst eingeschaltetes Licht
      # sofort wieder aus, bevor der Raummelder die Person erkannt hat.
      - condition: or
        conditions:
          - condition: not
            conditions:
              - condition: trigger
                id:
                  - Nachbar
          - condition: template
            value_template: >-
              {% set ons = expand(area_entities(target_area)) | selectattr('domain', 'eq', 'light') | selectattr('state', 'eq', 'on') | list %}
              {{ ons | length > 0 and (now() - (ons | map(attribute='last_changed') | max)).total_seconds() > 120 }}

      - condition: or
        conditions:
          - condition: template
            value_template: "{{ no_occupancy }}"

          - condition: occupancy.is_not_detected
            target:
              area_id: !input target_area
            options:
              behavior: all
              for: !input timeout

      - condition: or
        conditions:
          - condition: template
            value_template: "{{ no_motion }}"

          - condition: motion.is_not_detected
            target:
              area_id: !input target_area
            options:
              behavior: all
              for: !input timeout

      # Nachbarmelder (z. B. Flur) muessen gerade frei sein; leere Liste = immer erfuellt
      - condition: motion.is_not_detected
        target:
          entity_id: !input neighbor_sensors
        options:
          behavior: all

      - condition: occupancy.is_not_detected
        target:
          entity_id: !input neighbor_sensors
        options:
          behavior: all

    then:
      - action: light.turn_off
        target:
          area_id: !input target_area
        data: {}

mode: restart
